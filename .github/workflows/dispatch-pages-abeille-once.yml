name: Dispatch Abeille block 1 Pages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-abeille-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=main

      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove this one-shot helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-pages-abeille-once.yml
          git commit -m 'chore: remove Abeille one-shot Pages dispatcher'
          git push origin HEAD:main
