name: Verificar experiencia Guaurritas OS sin publicar

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/os-browser-smoke.mjs"
      - ".github/workflows/os-experience-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-os:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar variables de exportación
        run: cp .env.development .env.production
      - name: Probar regresiones del proyecto
        run: npm test
      - name: Compilar versión estática
        run: npm run build
      - name: Reutilizar navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1
      - name: Preparar navegadores
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Montar exportación local sin desplegar
        run: |
          mkdir -p .preview/guaurritas-web
          cp -a out/. .preview/guaurritas-web/
      - name: Probar UX en Chromium
        run: OS_BROWSER_ENGINE=chromium node tests/os-browser-smoke.mjs
      - name: Probar UX en WebKit Safari
        run: OS_BROWSER_ENGINE=webkit node tests/os-browser-smoke.mjs
      - name: Guardar capturas si alguna prueba falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: os-experience-failures
          path: os-smoke-artifacts/
          if-no-files-found: ignore
