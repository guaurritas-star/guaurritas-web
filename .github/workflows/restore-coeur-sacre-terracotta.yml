name: Restore verified Coeur Sacre Terracotta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-terracotta.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=12jXZXI3BTdWkyawKxQ3aUhJdbuV5brLZ&export=download&confirm=t' \
            -o /tmp/coeur-sacre-terracotta-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1VCdVqBYVydHZbm9z2c___4vayovAVHbb&export=download&confirm=t' \
            -o /tmp/coeur-sacre-terracotta-worn.png

      - name: Verify exact Coeur Sacre Terracotta binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-terracotta-product.png)" -eq 2529416
          test "$(wc -c < /tmp/coeur-sacre-terracotta-worn.png)" -eq 1912244
          echo '669d03c66a94337f1a80923f471d71993c238092a209afff0b03dd401c685b4f  /tmp/coeur-sacre-terracotta-product.png' | sha256sum -c -
          echo '03e9e33756005a26c243420f20921d9e8c067f09bd3e8b899665511e8f53e723  /tmp/coeur-sacre-terracotta-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/coeur-sacre-terracotta-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/coeur-sacre-terracotta-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Terracotta assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-terracotta-product.png public/couture/bandanas/coeur-sacre-terracotta.png
          cp /tmp/coeur-sacre-terracotta-worn.png public/couture/bandanas/coeur-sacre-terracotta-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/coeur-sacre-terracotta.png' in text:
              raise SystemExit('Terracotta already exists; refusing duplicate')
          anchor = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/coeur-sacre-tangerine.png", wornImage: "/couture/bandanas/coeur-sacre-tangerine-perro.png" },\n'
          addition = '  { id: "terracotta", name: "Terracotta", swatch: "#b86549", productImage: "/couture/bandanas/coeur-sacre-terracotta.png", wornImage: "/couture/bandanas/coeur-sacre-terracotta-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Tangerine anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Coeur Sacre Terracotta and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-terracotta.png
          git add public/couture/bandanas/coeur-sacre-terracotta-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-terracotta.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-coeur-sacre-terracotta.yml'
            'public/couture/bandanas/coeur-sacre-terracotta-perro.png'
            'public/couture/bandanas/coeur-sacre-terracotta.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Coeur Sacre Terracotta color'
          git push origin HEAD:main
