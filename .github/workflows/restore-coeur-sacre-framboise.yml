name: Restore verified Coeur Sacre Framboise

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-framboise.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1hVa6ruN8KVT7SeD67wezbeqYLHzUDtYq&export=download&confirm=t' \
            -o /tmp/coeur-sacre-framboise-product.jpg
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1RCkg48hotfHOX2SWpDJKtR1p_R2HysFR&export=download&confirm=t' \
            -o /tmp/coeur-sacre-framboise-worn.png

      - name: Verify exact Coeur Sacre Framboise binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-framboise-product.jpg)" -eq 312154
          test "$(wc -c < /tmp/coeur-sacre-framboise-worn.png)" -eq 1918775
          echo '4e5610c92937fde9795dfb490d95060cdac298e5d915b1bea5a9d6e676499ce6  /tmp/coeur-sacre-framboise-product.jpg' | sha256sum -c -
          echo 'c8a811df478e8710879d6e220a2097ab02018ffb75098570d29fee9af2c47650  /tmp/coeur-sacre-framboise-worn.png' | sha256sum -c -
          test "$(head -c 3 /tmp/coeur-sacre-framboise-product.jpg | xxd -p)" = 'ffd8ff'
          test "$(head -c 8 /tmp/coeur-sacre-framboise-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Framboise assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-framboise-product.jpg public/couture/bandanas/coeur-sacre-framboise.jpg
          cp /tmp/coeur-sacre-framboise-worn.png public/couture/bandanas/coeur-sacre-framboise-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          entry = '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/coeur-sacre-framboise.jpg", wornImage: "/couture/bandanas/coeur-sacre-framboise-perro.png" },\n'
          if 'coeur-sacre-framboise' in text:
              raise SystemExit('Coeur Sacre Framboise already exists; refusing duplicate')
          anchor = '  { id: "foret", name: "Fôret", swatch: "#355c45", productImage: "/couture/bandanas/coeur-sacre-foret.png", wornImage: "/couture/bandanas/coeur-sacre-foret-perro.png" },\n];'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Coeur Sacre Foret anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor[:-2] + entry + '];', 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check
          git diff --name-only | sort

      - name: Commit only Coeur Sacre Framboise and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-framboise.jpg
          git add public/couture/bandanas/coeur-sacre-framboise-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-framboise.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-coeur-sacre-framboise.yml'
            'public/couture/bandanas/coeur-sacre-framboise-perro.png'
            'public/couture/bandanas/coeur-sacre-framboise.jpg'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Coeur Sacre Framboise color'
          git push origin HEAD:main
