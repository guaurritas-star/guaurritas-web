name: Enable verified Framboise color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-framboise.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add only Framboise to Amulette selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'id: "framboise"' in text:
              raise SystemExit('Framboise already present; refusing duplicate')
          anchor = '  { id: "ciel", name: "Ciel", swatch: "#a9cdf5", productImage: "/couture/bandanas/amulette-ciel.png", wornImage: "/couture/bandanas/amulette-ciel-perro.png" },\n];'
          replacement = '  { id: "ciel", name: "Ciel", swatch: "#a9cdf5", productImage: "/couture/bandanas/amulette-ciel.png", wornImage: "/couture/bandanas/amulette-ciel-perro.png" },\n  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/amulette-framboise.jpg", wornImage: "/couture/bandanas/amulette-framboise-perro.png" },\n];'
          if text.count(anchor) != 1:
              raise SystemExit('Expected selector anchor not found exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Verify project still builds
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit only selector change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/enable-framboise.yml
          git diff --cached --check
          git commit -m 'feat(couture): enable verified Framboise color'
          git push origin HEAD:main
