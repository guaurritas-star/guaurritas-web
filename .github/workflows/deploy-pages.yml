name: Publicar Guaurritas en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar conexión pública de Guaurrinotas
        run: cp .env.development .env.production

      - name: Verificar regresiones de carrito y sesión
        run: npm test

      - name: Generar HTML estático
        run: npm run build

      - name: Identificar publicaciones anteriores
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'deploy-pages.yml',
              branch: 'main', status: 'success', per_page: 2,
            });
            for (let i = 0; i < 2; i++) {
              const run = data.workflow_runs[i];
              if (!run) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id,
              });
              const available = artifacts.data.artifacts.some(a =>
                !a.expired && a.name === `github-pages-${run.id}`);
              if (available) core.setOutput(`run${i}`, String(run.id));
            }

      - name: Recuperar recursos de la publicación anterior
        if: steps.previous.outputs.run0 != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ steps.previous.outputs.run0 }}
          run-id: ${{ steps.previous.outputs.run0 }}
          github-token: ${{ github.token }}
          path: .previous-pages/first

      - name: Recuperar recursos de la penúltima publicación
        if: steps.previous.outputs.run1 != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ steps.previous.outputs.run1 }}
          run-id: ${{ steps.previous.outputs.run1 }}
          github-token: ${{ github.token }}
          path: .previous-pages/second

      - name: Conservar hashes recientes y verificar recursos
        run: |
          for archive in .previous-pages/*/artifact.tar; do
            [ -f "$archive" ] || continue
            destination="$(dirname "$archive")/site"
            mkdir -p "$destination"
            tar -xf "$archive" -C "$destination" ./_next/static
          done
          node scripts/prepare-pages.mjs .previous-pages/first/site .previous-pages/second/site

      - name: Subir HTML de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: ./out
          retention-days: 8

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}

      - name: Comprobar recursos críticos en GitHub Pages
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}/"
          for asset in \
            "icons/desktop/cart-empty.webp" \
            "icons/desktop/world-planet.webp" \
            "icons/desktop/pet-food-bowl.webp" \
            "icons/desktop/robbie-folder-closed.webp"; do
            echo "Verificando ${base}${asset}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 4 \
              --output /dev/null "${base}${asset}"
          done
          echo "Los iconos de escritorio están disponibles públicamente."
