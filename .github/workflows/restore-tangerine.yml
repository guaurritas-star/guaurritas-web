name: Restore verified Tangerine color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-tangerine.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Tangerine originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1CbuNu_6F6nH_YvSpfIbAzQlyJDuplBdK&export=download&confirm=t' \
            -o /tmp/tangerine-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1c-y_380Reng5_PGW2QYcyOMUhBI-uvnk&export=download&confirm=t' \
            -o /tmp/tangerine-worn.png

      - name: Verify exact Tangerine binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/tangerine-product.png)" -eq 2338019
          test "$(wc -c < /tmp/tangerine-worn.png)" -eq 2124498
          echo 'fab7da899accc00eee22ab5c59fd4425870599ed7b946fd6c7aa591812dce063  /tmp/tangerine-product.png' | sha256sum -c -
          echo 'c4400dc429203d0fefa0480643acfc5d5b441ef7e07d91554b0bbb5b48e3c4fc  /tmp/tangerine-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/tangerine-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/tangerine-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Replace only Tangerine images and enable Tangerine
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/tangerine-product.png public/couture/bandanas/amulette-tangerine.png
          cp /tmp/tangerine-worn.png public/couture/bandanas/amulette-tangerine-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'id: "tangerine"' in text:
              raise SystemExit('Tangerine selector already exists; refusing duplicate')
          anchor = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/amulette-soleil.png", wornImage: "/couture/bandanas/amulette-soleil-perro.png" },\n'
          entry = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/amulette-tangerine.png", wornImage: "/couture/bandanas/amulette-tangerine-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected exact Soleil anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and diff
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Tangerine changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/amulette-tangerine.png
          git add public/couture/bandanas/amulette-tangerine-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-tangerine.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-tangerine.yml'
            'public/couture/bandanas/amulette-tangerine-perro.png'
            'public/couture/bandanas/amulette-tangerine.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): restore and enable verified Tangerine color'
          git push origin HEAD:main
