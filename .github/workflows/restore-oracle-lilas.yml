name: Restore verified Oracle Lilas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-oracle-lilas.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Oracle Lilas originals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1xg0ZAxkOW7vbRcr7LTj7RtlzdOeG3hpZ&export=download&confirm=t' \
            -o /tmp/oracle-lilas-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1_8YaGmVnTBGck7BfSiI-VmbuP3lzFUCW&export=download&confirm=t' \
            -o /tmp/oracle-lilas-worn.png

      - name: Verify exact Oracle Lilas binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/oracle-lilas-product.png)" -eq 2974361
          test "$(wc -c < /tmp/oracle-lilas-worn.png)" -eq 2010273
          echo '3ba4d9d12d0459f25ef18feeb525745ead25c0286e805bde13caf0b790a88174  /tmp/oracle-lilas-product.png' | sha256sum -c -
          echo '3efce681f17e1919d1da5dac72bc0c09c97331e20451cf29d61f2ab02a4cfd8a  /tmp/oracle-lilas-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/oracle-lilas-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/oracle-lilas-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Oracle Lilas assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/oracle-lilas-product.png public/couture/bandanas/oracle-lilas.png
          cp /tmp/oracle-lilas-worn.png public/couture/bandanas/oracle-lilas-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/oracle-lilas.png' in text:
              raise SystemExit('Oracle Lilas already exists; refusing duplicate')
          anchor = '  { id: "ivoire", name: "Ivoire", swatch: "#eee4d2", productImage: "/couture/bandanas/oracle-ivoire.png", wornImage: "/couture/bandanas/oracle-ivoire-perro.png" },\n'
          addition = '  { id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/oracle-lilas.png", wornImage: "/couture/bandanas/oracle-lilas-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Oracle Ivoire anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Oracle Lilas and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/oracle-lilas.png
          git add public/couture/bandanas/oracle-lilas-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-oracle-lilas.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-oracle-lilas.yml'
            'public/couture/bandanas/oracle-lilas-perro.png'
            'public/couture/bandanas/oracle-lilas.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Oracle Lilas color'
          git push origin HEAD:main