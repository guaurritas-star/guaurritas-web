name: Add Abeille collection card safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-abeille-collection.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Abeille collection below Amulette only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          old_type = 'type CollectionId = "amulette" | "clasica" | "encanto";'
          new_type = 'type CollectionId = "amulette" | "abeille" | "clasica" | "encanto";'
          if text.count(old_type) != 1:
              raise SystemExit('CollectionId anchor changed; refusing broad edit')
          if 'id: "abeille"' in text:
              raise SystemExit('Abeille collection already exists; refusing duplicate')
          if 'const abeilleColors: BandanaColor[]' not in text:
              raise SystemExit('Abeille Ciel color data missing')
          marker = '    colors: amuletteColors,\n  },\n  {\n    id: "clasica",'
          if text.count(marker) != 1:
              raise SystemExit('Amulette-to-Clasica anchor changed; refusing broad edit')
          abeille_lines = [
              '    colors: amuletteColors,',
              '  },',
              '  {',
              '    id: "abeille",',
              '    name: "Bandana Abeille",',
              '    eyebrow: "Colección Abeille",',
              '    symbol: "🐝",',
              '    description: "Tejido, cuentas y textura para un look especial sin perder el encanto artesanal.",',
              '    detail:',
              '      "Bandana artesanal tejida a mano, con flecos y cuentas decorativas. Se ajusta con sus propias tiras y está pensada como accesorio de uso supervisado.",',
              '    prices: { mini: 219, chica: 279, mediana: 329, grande: 379, xl: 439 },',
              '    nationalPrices: { mini: 249, chica: 309, mediana: 359, grande: 409, xl: 479 },',
              '    colors: abeilleColors,',
              '  },',
              '  {',
              '    id: "clasica",',
          ]
          replacement = '\n'.join(abeille_lines)
          text = text.replace(old_type, new_type, 1)
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Verify placement, prices, build and diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/apps/CoutureStoreApp.tsx').read_text()
          ids = ['id: "amulette"', 'id: "abeille"', 'id: "clasica"', 'id: "encanto"']
          for item in ids:
              if text.count(item) != 1:
                  raise SystemExit(f'Expected exactly one {item}')
          positions = [text.index(item) for item in ids]
          if positions != sorted(positions):
              raise SystemExit('Wrong collection order')
          abeille = text[text.index('id: "abeille"'):text.index('id: "clasica"')]
          for token in [
              'prices: { mini: 219, chica: 279, mediana: 329, grande: 379, xl: 439 }',
              'nationalPrices: { mini: 249, chica: 309, mediana: 359, grande: 409, xl: 479 }',
              'colors: abeilleColors',
          ]:
              if token not in abeille:
                  raise SystemExit(f'Missing Abeille token: {token}')
          PY
          npm ci
          npm run build
          git diff --check

      - name: Commit only Couture app change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/add-abeille-collection.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=( '.github/workflows/add-abeille-collection.yml' 'src/components/apps/CoutureStoreApp.tsx' )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add Bandana Abeille collection'
          git push origin HEAD:main
