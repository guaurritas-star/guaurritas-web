name: Restore verified Abeille Ciel color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-abeille-ciel.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Abeille Ciel originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=12hPIMlUCpndQS2W7f9xj2VnEeNBioiRW&export=download&confirm=t' \
            -o /tmp/abeille-ciel-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=14D-6a038JKQMsXJ6ISzdgeIDvINXdOV_&export=download&confirm=t' \
            -o /tmp/abeille-ciel-worn.png

      - name: Verify exact Abeille Ciel binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/abeille-ciel-product.png)" -eq 2358407
          test "$(wc -c < /tmp/abeille-ciel-worn.png)" -eq 1856011
          echo '202150049de8764978612636eff87a18ab3d7514980788386720a2e904bfefb2  /tmp/abeille-ciel-product.png' | sha256sum -c -
          echo 'b4469f295201db4494f351cd34227a8a7e2d50bbbaa3f36dc3565c8160356d02  /tmp/abeille-ciel-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/abeille-ciel-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/abeille-ciel-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Abeille Ciel assets and color data
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/abeille-ciel-product.png public/couture/bandanas/abeille-ciel.png
          cp /tmp/abeille-ciel-worn.png public/couture/bandanas/abeille-ciel-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'const abeilleColors' in text:
              raise SystemExit('Abeille color array already exists; refusing duplicate')
          anchor = '];\n\nconst collections: BandanaCollection[] = ['
          block = '''\n\nconst abeilleColors: BandanaColor[] = [\n  { id: "ciel", name: "Ciel", swatch: "#a9cdf5", productImage: "/couture/bandanas/abeille-ciel.png", wornImage: "/couture/bandanas/abeille-ciel-perro.png" },\n];'''
          if text.count(anchor) != 1:
              raise SystemExit('Expected collection anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, '];' + block + '\n\nconst collections: BandanaCollection[] = [', 1))
          PY

      - name: Verify build and diff
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Abeille Ciel changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/abeille-ciel.png
          git add public/couture/bandanas/abeille-ciel-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-abeille-ciel.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-abeille-ciel.yml'
            'public/couture/bandanas/abeille-ciel-perro.png'
            'public/couture/bandanas/abeille-ciel.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Abeille Ciel color assets'
          git push origin HEAD:main
