name: Restore verified Coeur Sacre Lilas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-lilas.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1JG27JFylLS9hIU93A5Y6Xva5X_Vo08xq&export=download&confirm=t' \
            -o /tmp/coeur-sacre-lilas-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1inYHxblFx1tS-LkaxlazNQ9ovaL7tSEy&export=download&confirm=t' \
            -o /tmp/coeur-sacre-lilas-worn.png

      - name: Verify exact Coeur Sacre Lilas binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-lilas-product.png)" -eq 2324464
          test "$(wc -c < /tmp/coeur-sacre-lilas-worn.png)" -eq 2468970
          echo '72b92b0e2d96968842aef65f3254bea5016b89b43dbd13b184e73778f3cb441f  /tmp/coeur-sacre-lilas-product.png' | sha256sum -c -
          echo 'e4b7b7826fd807b135c49d780fc1d35fdede52eacaa2ee9777fce91b699c6b92  /tmp/coeur-sacre-lilas-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/coeur-sacre-lilas-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/coeur-sacre-lilas-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Lilas assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-lilas-product.png public/couture/bandanas/coeur-sacre-lilas.png
          cp /tmp/coeur-sacre-lilas-worn.png public/couture/bandanas/coeur-sacre-lilas-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/coeur-sacre-lilas.png"' in text:
              raise SystemExit('Coeur Sacre Lilas already exists; refusing duplicate')
          anchor = '  { id: "ivoire", name: "Ivoire", swatch: "#eee4d2", productImage: "/couture/bandanas/coeur-sacre-ivoire.png", wornImage: "/couture/bandanas/coeur-sacre-ivoire-perro.png" },\n'
          entry = '  { id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/coeur-sacre-lilas.png", wornImage: "/couture/bandanas/coeur-sacre-lilas-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Coeur Sacre Ivoire anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Coeur Sacre Lilas and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-lilas.png
          git add public/couture/bandanas/coeur-sacre-lilas-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-lilas.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-coeur-sacre-lilas.yml'
            'public/couture/bandanas/coeur-sacre-lilas-perro.png'
            'public/couture/bandanas/coeur-sacre-lilas.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Coeur Sacre Lilas color'
          git push origin HEAD:main
