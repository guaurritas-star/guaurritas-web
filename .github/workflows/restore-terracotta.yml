name: Restore verified Terracotta color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-terracotta.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Terracotta originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1b2z0E7V10Ho_1ebACWJsCp1dajfgOUVM&export=download&confirm=t' \
            -o /tmp/terracotta-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1G0QaZAlxULOguGq4JNjwpAs_ZgAxIOe2&export=download&confirm=t' \
            -o /tmp/terracotta-worn.png

      - name: Verify exact Terracotta binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/terracotta-product.png)" -eq 2170602
          test "$(wc -c < /tmp/terracotta-worn.png)" -eq 1899555
          echo 'e278e47da71744f038dcee84b707081f7c617dc37997e14f384192c25f342b8f  /tmp/terracotta-product.png' | sha256sum -c -
          echo 'eb1bb2a5058896900d5f1398754769b2ae64568f46d31b0772bbc238f58cadd5  /tmp/terracotta-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/terracotta-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/terracotta-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Replace only Terracotta images and enable Terracotta
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/terracotta-product.png public/couture/bandanas/amulette-terracotta.png
          cp /tmp/terracotta-worn.png public/couture/bandanas/amulette-terracotta-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'id: "terracotta"' in text:
              raise SystemExit('Terracotta selector already exists; refusing duplicate')
          anchor = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/amulette-tangerine.png", wornImage: "/couture/bandanas/amulette-tangerine-perro.png" },\n'
          entry = '  { id: "terracotta", name: "Terracotta", swatch: "#b86549", productImage: "/couture/bandanas/amulette-terracotta.png", wornImage: "/couture/bandanas/amulette-terracotta-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected exact Tangerine anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and diff
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Terracotta changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/amulette-terracotta.png
          git add public/couture/bandanas/amulette-terracotta-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-terracotta.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-terracotta.yml'
            'public/couture/bandanas/amulette-terracotta-perro.png'
            'public/couture/bandanas/amulette-terracotta.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): restore and enable verified Terracotta color'
          git push origin HEAD:main
