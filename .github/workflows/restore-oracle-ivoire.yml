name: Restore verified Oracle Ivoire

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-oracle-ivoire.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Oracle Ivoire originals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1xJ2Hjk5nsvrR1ryIkeOxfuubl1ITZwSq&export=download&confirm=t' \
            -o /tmp/oracle-ivoire-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Z9-AnvGEndrX2cSogS8Umd0KW7-J0TF1&export=download&confirm=t' \
            -o /tmp/oracle-ivoire-worn.png

      - name: Verify exact Oracle Ivoire binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/oracle-ivoire-product.png)" -eq 2911272
          test "$(wc -c < /tmp/oracle-ivoire-worn.png)" -eq 2017937
          echo '01066e637b099327fd60b409a37320aa3a06136a403a1c36556bbc7e379defa3  /tmp/oracle-ivoire-product.png' | sha256sum -c -
          echo 'c1c5bfa9f7d97755f54ca9ce2692ef5f72195441ddc748128b7a3b7e2468f769  /tmp/oracle-ivoire-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/oracle-ivoire-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/oracle-ivoire-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Oracle Ivoire assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/oracle-ivoire-product.png public/couture/bandanas/oracle-ivoire.png
          cp /tmp/oracle-ivoire-worn.png public/couture/bandanas/oracle-ivoire-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/oracle-ivoire.png' in text:
              raise SystemExit('Oracle Ivoire already exists; refusing duplicate')
          anchor = '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/oracle-framboise.png", wornImage: "/couture/bandanas/oracle-framboise-perro.png" },\n'
          addition = '  { id: "ivoire", name: "Ivoire", swatch: "#eee4d2", productImage: "/couture/bandanas/oracle-ivoire.png", wornImage: "/couture/bandanas/oracle-ivoire-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Oracle Framboise anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Oracle Ivoire and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/oracle-ivoire.png
          git add public/couture/bandanas/oracle-ivoire-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-oracle-ivoire.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-oracle-ivoire.yml'
            'public/couture/bandanas/oracle-ivoire-perro.png'
            'public/couture/bandanas/oracle-ivoire.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Oracle Ivoire color'
          git push origin HEAD:main