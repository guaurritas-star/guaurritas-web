name: Verify Coeur Sacre Ciel integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-coeur-sacre-ciel.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact Ciel assets and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/couture/bandanas/coeur-sacre-ciel.png)" -eq 2370625
          test "$(wc -c < public/couture/bandanas/coeur-sacre-ciel-perro.png)" -eq 1917043
          test "$(git hash-object public/couture/bandanas/coeur-sacre-ciel.png)" = '2e0e4155a552fd8e0380f55968ef17ecadcebe56'
          test "$(git hash-object public/couture/bandanas/coeur-sacre-ciel-perro.png)" = 'ffdafb98619fea204a8559a2a3eb15c7e692535b'
          grep -Fq 'const coeurSacreColors: BandanaColor[] = [' src/components/apps/CoutureStoreApp.tsx
          grep -Fq '{ id: "ciel", name: "Ciel", swatch: "#a9cdf5", productImage: "/couture/bandanas/coeur-sacre-ciel.png", wornImage: "/couture/bandanas/coeur-sacre-ciel-perro.png" },' src/components/apps/CoutureStoreApp.tsx
          grep -Fq 'id: "coeur-sacre"' src/components/apps/CoutureStoreApp.tsx
          grep -Fq 'name: "Bandana Cœur Sacré"' src/components/apps/CoutureStoreApp.tsx

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Remove verification helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-coeur-sacre-ciel.yml
          git commit -m 'chore: remove Coeur Sacre Ciel verifier'
          git push origin HEAD:main
