name: Restore verified Oracle Terracotta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-oracle-terracotta.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Oracle Terracotta originals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1JuJYTOt8BKeFiK5lLE0N8ZLPLON5F3gQ&export=download&confirm=t' \
            -o /tmp/oracle-terracotta-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1uVV18KULjvZtJP-lI1ZZuIDsheMHW4dJ&export=download&confirm=t' \
            -o /tmp/oracle-terracotta-worn.png

      - name: Verify exact Oracle Terracotta binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/oracle-terracotta-product.png)" -eq 2322683
          test "$(wc -c < /tmp/oracle-terracotta-worn.png)" -eq 2044987
          echo '7c853364977968cb480db23a39230531c074a09e6b8113c1a977d3b82ecdbf33  /tmp/oracle-terracotta-product.png' | sha256sum -c -
          echo '7f15fe022038dac97b84d72ea0a60597581a2736b682ca52ae7740b6e0dc91a7  /tmp/oracle-terracotta-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/oracle-terracotta-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/oracle-terracotta-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Oracle Terracotta assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/oracle-terracotta-product.png public/couture/bandanas/oracle-terracotta.png
          cp /tmp/oracle-terracotta-worn.png public/couture/bandanas/oracle-terracotta-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/oracle-terracotta.png' in text:
              raise SystemExit('Oracle Terracotta already exists; refusing duplicate')
          anchor = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/oracle-tangerine.png", wornImage: "/couture/bandanas/oracle-tangerine-perro.png" },\n'
          addition = '  { id: "terracotta", name: "Terracotta", swatch: "#b86549", productImage: "/couture/bandanas/oracle-terracotta.png", wornImage: "/couture/bandanas/oracle-terracotta-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Oracle Tangerine anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Oracle Terracotta and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/oracle-terracotta.png
          git add public/couture/bandanas/oracle-terracotta-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-oracle-terracotta.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-oracle-terracotta.yml'
            'public/couture/bandanas/oracle-terracotta-perro.png'
            'public/couture/bandanas/oracle-terracotta.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Oracle Terracotta color'
          git push origin HEAD:main
