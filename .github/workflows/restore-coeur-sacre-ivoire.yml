name: Restore verified Coeur Sacre Ivoire

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-ivoire.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1bstwN7l4n1SlTlVZbNGgoOrsw43xMrqM&export=download&confirm=t' \
            -o /tmp/coeur-sacre-ivoire-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1XAo8udLxDouwcbm0ZNwACDJu_p1vOcO2&export=download&confirm=t' \
            -o /tmp/coeur-sacre-ivoire-worn.png

      - name: Verify exact Coeur Sacre Ivoire binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-ivoire-product.png)" -eq 2251944
          test "$(wc -c < /tmp/coeur-sacre-ivoire-worn.png)" -eq 1900240
          echo 'ea4b6fb3234bbd2d7b8444f2af1dd7cedb94b5d3a3943ccc45b5e00ec2272c71  /tmp/coeur-sacre-ivoire-product.png' | sha256sum -c -
          echo '36055ba3f40d7dfd02eef79a2d465d032c166dc8ab3e63cb7eb671203bf9c6a1  /tmp/coeur-sacre-ivoire-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/coeur-sacre-ivoire-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/coeur-sacre-ivoire-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Ivoire assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-ivoire-product.png public/couture/bandanas/coeur-sacre-ivoire.png
          cp /tmp/coeur-sacre-ivoire-worn.png public/couture/bandanas/coeur-sacre-ivoire-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          entry = '  { id: "ivoire", name: "Ivoire", swatch: "#eee4d2", productImage: "/couture/bandanas/coeur-sacre-ivoire.png", wornImage: "/couture/bandanas/coeur-sacre-ivoire-perro.png" },\n'
          if '/couture/bandanas/coeur-sacre-ivoire.png' in text:
              raise SystemExit('Ivoire already exists; refusing duplicate')
          anchor = '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/coeur-sacre-framboise.jpg", wornImage: "/couture/bandanas/coeur-sacre-framboise-perro.png" },\n];\n\nconst collections: BandanaCollection[] = ['
          replacement = '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/coeur-sacre-framboise.jpg", wornImage: "/couture/bandanas/coeur-sacre-framboise-perro.png" },\n' + entry + '];\n\nconst collections: BandanaCollection[] = ['
          if text.count(anchor) != 1:
              raise SystemExit('Expected Coeur Sacre anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            'public/couture/bandanas/coeur-sacre-ivoire-perro.png'
            'public/couture/bandanas/coeur-sacre-ivoire.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit only Coeur Sacre Ivoire and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-ivoire.png
          git add public/couture/bandanas/coeur-sacre-ivoire-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-ivoire.yml
          git diff --cached --check
          git commit -m 'feat(couture): add verified Coeur Sacre Ivoire color'
          git push origin HEAD:main
