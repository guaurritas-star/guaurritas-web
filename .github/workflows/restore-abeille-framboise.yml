name: Restore verified Abeille Framboise color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-abeille-framboise.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Abeille Framboise originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1SWRmZwnafEIRiwSoVTrASFNB7tDmU4KN&export=download&confirm=t' \
            -o /tmp/abeille-framboise-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1P0_qxVWuhYpeOct301o9hGSzsFm7rtml&export=download&confirm=t' \
            -o /tmp/abeille-framboise-worn.png

      - name: Verify exact Abeille Framboise binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/abeille-framboise-product.png)" -eq 2406908
          test "$(wc -c < /tmp/abeille-framboise-worn.png)" -eq 2561111
          echo 'f4cd5b32b2a33989fb28710ede654366287dab7c3436f6d2153b026114c70769  /tmp/abeille-framboise-product.png' | sha256sum -c -
          echo 'b1df4415a4a144a1cba9900e627b3cb869a5c02e62af46b8b1e16fdc8ddfb910  /tmp/abeille-framboise-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/abeille-framboise-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/abeille-framboise-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Abeille Framboise assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/abeille-framboise-product.png public/couture/bandanas/abeille-framboise.png
          cp /tmp/abeille-framboise-worn.png public/couture/bandanas/abeille-framboise-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'productImage: "/couture/bandanas/abeille-framboise.png"' in text:
              raise SystemExit('Abeille Framboise already exists; refusing duplicate')
          anchor = '  { id: "ivoire", name: "Ivoire", swatch: "#eee4d2", productImage: "/couture/bandanas/abeille-ivoire.png", wornImage: "/couture/bandanas/abeille-ivoire-perro.png" },\n'
          addition = anchor + '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/abeille-framboise.png", wornImage: "/couture/bandanas/abeille-framboise-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Ivoire Abeille anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Abeille Framboise changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/abeille-framboise.png
          git add public/couture/bandanas/abeille-framboise-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-abeille-framboise.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-abeille-framboise.yml'
            'public/couture/bandanas/abeille-framboise-perro.png'
            'public/couture/bandanas/abeille-framboise.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Abeille Framboise color'
          git push origin HEAD:main
