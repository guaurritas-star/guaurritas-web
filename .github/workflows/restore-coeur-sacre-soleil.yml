name: Restore verified Coeur Sacre Soleil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-soleil.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1pUc_avhmh41E5OUl_nmEmux3POrR8Bfd&export=download&confirm=t' -o /tmp/coeur-sacre-soleil-product.png
          curl -L --fail --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1VWdN8cAW4wiGPqXafdFNHXRLh6-IOntx&export=download&confirm=t' -o /tmp/coeur-sacre-soleil-worn.png

      - name: Verify exact Coeur Sacre Soleil binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-soleil-product.png)" -eq 2351543
          test "$(wc -c < /tmp/coeur-sacre-soleil-worn.png)" -eq 2493147
          echo 'b70194553bf6553b2b103daa51444c32f13416b2c845429cc93752342e4ba031  /tmp/coeur-sacre-soleil-product.png' | sha256sum -c -
          echo '2bcdf5a3d23e239fe45b916532e8e541eb47f2835bc7a4cc383710e5a5705492  /tmp/coeur-sacre-soleil-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/coeur-sacre-soleil-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/coeur-sacre-soleil-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Soleil assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-soleil-product.png public/couture/bandanas/coeur-sacre-soleil.png
          cp /tmp/coeur-sacre-soleil-worn.png public/couture/bandanas/coeur-sacre-soleil-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          entry = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/coeur-sacre-soleil.png", wornImage: "/couture/bandanas/coeur-sacre-soleil-perro.png" },\n'
          if entry in text:
              raise SystemExit('Soleil entry already exists; refusing duplicate')
          anchor = '  { id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/coeur-sacre-lilas.png", wornImage: "/couture/bandanas/coeur-sacre-lilas-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Lilas anchor exactly once')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Coeur Sacre Soleil and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-soleil.png
          git add public/couture/bandanas/coeur-sacre-soleil-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-soleil.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-coeur-sacre-soleil.yml'
            'public/couture/bandanas/coeur-sacre-soleil-perro.png'
            'public/couture/bandanas/coeur-sacre-soleil.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Coeur Sacre Soleil color'
          git push origin HEAD:main
