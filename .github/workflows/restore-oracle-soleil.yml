name: Restore verified Oracle Soleil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-oracle-soleil.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Oracle Soleil originals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1sM_STugeWwQsIpklL6P9gUQEonSBypVU&export=download&confirm=t' \
            -o /tmp/oracle-soleil-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1t8nWzyLQOJSwS5YdiC5MtvR9YZhKzPmc&export=download&confirm=t' \
            -o /tmp/oracle-soleil-worn.png

      - name: Verify exact Oracle Soleil binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/oracle-soleil-product.png)" -eq 2090503
          test "$(wc -c < /tmp/oracle-soleil-worn.png)" -eq 2755890
          echo 'b5c3a9680a64cd327cdda19d03e506435a564793c5bf7819ff5571745cc1d78c  /tmp/oracle-soleil-product.png' | sha256sum -c -
          echo 'c8869ab860d169e2043a2b615c8209c8d6d84e1af1671ae20d061ec671002228  /tmp/oracle-soleil-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/oracle-soleil-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/oracle-soleil-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Oracle Soleil assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/oracle-soleil-product.png public/couture/bandanas/oracle-soleil.png
          cp /tmp/oracle-soleil-worn.png public/couture/bandanas/oracle-soleil-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/oracle-soleil.png' in text:
              raise SystemExit('Oracle Soleil already exists; refusing duplicate')
          anchor = '  { id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/oracle-lilas.png", wornImage: "/couture/bandanas/oracle-lilas-perro.png" },\n'
          addition = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/oracle-soleil.png", wornImage: "/couture/bandanas/oracle-soleil-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Oracle Lilas anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Oracle Soleil and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/oracle-soleil.png
          git add public/couture/bandanas/oracle-soleil-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-oracle-soleil.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-oracle-soleil.yml'
            'public/couture/bandanas/oracle-soleil-perro.png'
            'public/couture/bandanas/oracle-soleil.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Oracle Soleil color'
          git push origin HEAD:main
