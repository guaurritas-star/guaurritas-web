name: Restore verified Abeille Lilas color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-abeille-lilas.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Abeille Lilas originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Cl282JtxvbqpGjY_2hV6DTqYkAK0JnEk&export=download&confirm=t' \
            -o /tmp/abeille-lilas-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1eMYLXcUERrG0jPEM2pKyfRQwWLJjkSss&export=download&confirm=t' \
            -o /tmp/abeille-lilas-worn.png

      - name: Verify exact Abeille Lilas binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/abeille-lilas-product.png)" -eq 2180631
          test "$(wc -c < /tmp/abeille-lilas-worn.png)" -eq 2461665
          echo 'ea9c79933ce1f4afa6b5b00f839492477bdbd89fb00c74f49aaefc6b4b370c6d  /tmp/abeille-lilas-product.png' | sha256sum -c -
          echo 'c746faff441db875f8148b607d25491b2adf146e49344fa0b80d287d7c20febc  /tmp/abeille-lilas-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/abeille-lilas-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/abeille-lilas-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Abeille Lilas assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/abeille-lilas-product.png public/couture/bandanas/abeille-lilas.png
          cp /tmp/abeille-lilas-worn.png public/couture/bandanas/abeille-lilas-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'productImage: "/couture/bandanas/abeille-lilas.png"' in text:
              raise SystemExit('Abeille Lilas already exists; refusing duplicate')
          anchor = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/abeille-tangerine.jpg", wornImage: "/couture/bandanas/abeille-tangerine-perro.png" },\n'
          entry = '  { id: "lilas", name: "Lilas", swatch: "#bba3d5", productImage: "/couture/bandanas/abeille-lilas.png", wornImage: "/couture/bandanas/abeille-lilas-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Abeille Tangerine anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check
          git diff -- src/components/apps/CoutureStoreApp.tsx | grep -F 'abeille-lilas'

      - name: Commit only Abeille Lilas changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/abeille-lilas.png
          git add public/couture/bandanas/abeille-lilas-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-abeille-lilas.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-abeille-lilas.yml'
            'public/couture/bandanas/abeille-lilas-perro.png'
            'public/couture/bandanas/abeille-lilas.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Abeille Lilas color'
          git push origin HEAD:main
