name: Dispatch Group 2 deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-group2-deploy.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove this one-time helper first
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-group2-deploy.yml
          git commit -m 'chore: remove one-time Group 2 deploy dispatcher'
          git push origin HEAD:main

      - name: Dispatch existing manual Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main -R guaurritas-star/guaurritas-web
