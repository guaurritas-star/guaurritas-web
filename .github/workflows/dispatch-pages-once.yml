name: Dispatch Pages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Remove one-shot helper
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit helper cleanup only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-pages-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore: remove one-shot Pages dispatcher'
          git push origin HEAD:main
