name: Dispatch Pages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch existing manual Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Remove one-shot helper
        run: git rm .github/workflows/dispatch-pages-once.yml

      - name: Commit helper cleanup only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-shot Pages dispatcher'
          git push origin main
