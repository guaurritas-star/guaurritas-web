name: Restore verified Abeille Terracotta color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-abeille-terracotta.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Abeille Terracotta originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1e76yJjpt0oOfkuH3QwFsHl0YHv0uniOA&export=download&confirm=t' -o /tmp/abeille-terracotta-product.png
          curl -L --fail --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=19_YWqEvMg7AB6RUj8g_GV4ob6G74Eg_A&export=download&confirm=t' -o /tmp/abeille-terracotta-worn.png

      - name: Verify exact Abeille Terracotta binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/abeille-terracotta-product.png)" -eq 2325109
          test "$(wc -c < /tmp/abeille-terracotta-worn.png)" -eq 1951124
          echo 'e14ed0533b1d2dac7c152e7f39565dab32b233edd2054e82c481342cf60c4d07  /tmp/abeille-terracotta-product.png' | sha256sum -c -
          echo '35a42a1e2793479575a6afc9db943e75b7f3262e7968c907cab249cfc5f14e54  /tmp/abeille-terracotta-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/abeille-terracotta-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/abeille-terracotta-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Abeille Terracotta assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/abeille-terracotta-product.png public/couture/bandanas/abeille-terracotta.png
          cp /tmp/abeille-terracotta-worn.png public/couture/bandanas/abeille-terracotta-perro.png
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/apps/CoutureStoreApp.tsx')
          text = p.read_text()
          if 'id: "terracotta", name: "Terracotta", swatch: "#b86549", productImage: "/couture/bandanas/abeille-terracotta.png"' in text:
              raise SystemExit('Abeille Terracotta already exists')
          anchor = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/abeille-soleil.png", wornImage: "/couture/bandanas/abeille-soleil-perro.png" },\n];'
          repl = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/abeille-soleil.png", wornImage: "/couture/bandanas/abeille-soleil-perro.png" },\n  { id: "terracotta", name: "Terracotta", swatch: "#b86549", productImage: "/couture/bandanas/abeille-terracotta.png", wornImage: "/couture/bandanas/abeille-terracotta-perro.png" },\n];'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Abeille Soleil anchor once')
          p.write_text(text.replace(anchor, repl, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Abeille Terracotta changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/abeille-terracotta.png public/couture/bandanas/abeille-terracotta-perro.png src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-abeille-terracotta.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' '.github/workflows/restore-abeille-terracotta.yml' 'public/couture/bandanas/abeille-terracotta-perro.png' 'public/couture/bandanas/abeille-terracotta.png' 'src/components/apps/CoutureStoreApp.tsx' | sort > /tmp/expected.txt
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Abeille Terracotta color'
          git push origin HEAD:main
