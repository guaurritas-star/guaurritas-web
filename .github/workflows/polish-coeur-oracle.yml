name: Polish Coeur Sacre and Oracle cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-coeur-oracle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Couture card integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/apps/CoutureStoreApp.tsx')
          s = p.read_text()
          old1 = 'item.id === "oracle" ? "bg-transparent" : "bg-white"'
          new1 = 'item.id === "oracle" || item.id === "coeur-sacre" ? "bg-transparent" : "bg-white"'
          old2 = 'item.id === "oracle" ? "scale-[1.08] p-0 mix-blend-multiply group-hover:scale-[1.12]" : "p-1 group-hover:scale-105"'
          new2 = 'item.id === "oracle" || item.id === "coeur-sacre" ? "scale-[1.08] p-0 mix-blend-multiply group-hover:scale-[1.12]" : "p-1 group-hover:scale-105"'
          assert s.count(old1) == 1
          assert s.count(old2) == 1
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/polish-coeur-oracle.yml
          git diff --cached --check
          git commit -m 'fix(couture): integrate Coeur Sacre and Oracle cards'
          git push origin main
