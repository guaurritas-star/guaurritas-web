name: Sync Couture cart and image loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-couture-cart-loading.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Couture update
        run: python scripts/update-couture-cart-loading.py

      - name: Verify build
        run: |
          set -euo pipefail
          grep -q 'requestSystemCartOpen' src/components/apps/CoutureStoreApp.tsx
          grep -q 'guaurritas:cuisine-cart-request' src/components/apps/CoutureStoreApp.tsx
          grep -q 'function BandanaImage' src/components/apps/CoutureStoreApp.tsx
          grep -q 'Abriendo…' src/components/apps/CoutureStoreApp.tsx
          npm ci
          npm run build
          git diff --check

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/sync-couture-cart-loading.yml
          git rm scripts/update-couture-cart-loading.py
          git diff --cached --check
          git commit -m 'feat(couture): sync cart and show image loading state'
          git push origin main

# rerun after type correction
