name: Restore verified Abeille Tangerine color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-abeille-tangerine.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Abeille Tangerine originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Q1gtiMAGEhylJGPWQ247u74EupMzOj7s&export=download&confirm=t' \
            -o /tmp/abeille-tangerine-product.jpg
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1OEZB5WHVekuN1A5tOPA-tKEb22e-wSL7&export=download&confirm=t' \
            -o /tmp/abeille-tangerine-worn.png

      - name: Verify exact Abeille Tangerine binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/abeille-tangerine-product.jpg)" -eq 235954
          test "$(wc -c < /tmp/abeille-tangerine-worn.png)" -eq 1619907
          echo 'e28dc97ddee5b1fb9084d6497336f4d1f6c4f63e808e01ac15974d060a0146fd  /tmp/abeille-tangerine-product.jpg' | sha256sum -c -
          echo 'e58d72295e4e83937c640ed50b158d751669d6c20fee96d675e59c81cea8d6e2  /tmp/abeille-tangerine-worn.png' | sha256sum -c -
          test "$(head -c 3 /tmp/abeille-tangerine-product.jpg | xxd -p)" = 'ffd8ff'
          test "$(head -c 8 /tmp/abeille-tangerine-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Abeille Tangerine assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/abeille-tangerine-product.jpg public/couture/bandanas/abeille-tangerine.jpg
          cp /tmp/abeille-tangerine-worn.png public/couture/bandanas/abeille-tangerine-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if 'abeille-tangerine' in text:
              raise SystemExit('Abeille Tangerine already exists; refusing duplicate')
          anchor = '  { id: "foret", name: "Fôret", swatch: "#355c45", productImage: "/couture/bandanas/abeille-foret.png", wornImage: "/couture/bandanas/abeille-foret-perro.png" },\n'
          entry = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/abeille-tangerine.jpg", wornImage: "/couture/bandanas/abeille-tangerine-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Abeille Fôret anchor once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + entry, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check
          grep -F 'id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/abeille-tangerine.jpg", wornImage: "/couture/bandanas/abeille-tangerine-perro.png"' src/components/apps/CoutureStoreApp.tsx
          grep -F 'type CollectionId = "amulette" | "abeille" | "clasica" | "encanto";' src/components/apps/CoutureStoreApp.tsx

      - name: Commit only Abeille Tangerine changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/abeille-tangerine.jpg
          git add public/couture/bandanas/abeille-tangerine-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-abeille-tangerine.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-abeille-tangerine.yml'
            'public/couture/bandanas/abeille-tangerine-perro.png'
            'public/couture/bandanas/abeille-tangerine.jpg'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Abeille Tangerine color'
          git push origin HEAD:main
