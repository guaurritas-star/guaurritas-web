name: Restore verified Coeur Sacre Tangerine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-coeur-sacre-tangerine.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact public temp copies
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1DxexjUEmM7Iy0YwkB6k2p7H3GteFXJyY&export=download&confirm=t' \
            -o /tmp/coeur-sacre-tangerine-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1OydsJMiuf2sjfU7hTA7nLi-9G9utUBWw&export=download&confirm=t' \
            -o /tmp/coeur-sacre-tangerine-worn.png

      - name: Verify exact Coeur Sacre Tangerine binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/coeur-sacre-tangerine-product.png)" -eq 2431203
          test "$(wc -c < /tmp/coeur-sacre-tangerine-worn.png)" -eq 2496843
          echo 'a18bd3118c9015b456dc1b75d2cb07af1246aa601101110fd0e40542428e2414  /tmp/coeur-sacre-tangerine-product.png' | sha256sum -c -
          echo 'e86f6f6b5377d862eb98160ea8882a34366192c3efab822596f983e4add4a8e5  /tmp/coeur-sacre-tangerine-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/coeur-sacre-tangerine-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/coeur-sacre-tangerine-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Coeur Sacre Tangerine assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/coeur-sacre-tangerine-product.png public/couture/bandanas/coeur-sacre-tangerine.png
          cp /tmp/coeur-sacre-tangerine-worn.png public/couture/bandanas/coeur-sacre-tangerine-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/coeur-sacre-tangerine.png' in text:
              raise SystemExit('Tangerine already exists; refusing duplicate')
          anchor = '  { id: "soleil", name: "Soleil", swatch: "#d7a936", productImage: "/couture/bandanas/coeur-sacre-soleil.png", wornImage: "/couture/bandanas/coeur-sacre-soleil-perro.png" },\n'
          addition = '  { id: "tangerine", name: "Tangerine", swatch: "#dd7843", productImage: "/couture/bandanas/coeur-sacre-tangerine.png", wornImage: "/couture/bandanas/coeur-sacre-tangerine-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Soleil anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Coeur Sacre Tangerine and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/coeur-sacre-tangerine.png
          git add public/couture/bandanas/coeur-sacre-tangerine-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-coeur-sacre-tangerine.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-coeur-sacre-tangerine.yml'
            'public/couture/bandanas/coeur-sacre-tangerine-perro.png'
            'public/couture/bandanas/coeur-sacre-tangerine.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Coeur Sacre Tangerine color'
          git push origin HEAD:main
