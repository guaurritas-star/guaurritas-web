name: Dispatch Abeille final Pages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-abeille-final-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual Pages workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -L --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove this one-shot helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-pages-abeille-final-once.yml
          git commit -m 'chore: remove Abeille final Pages dispatcher'
          git push origin HEAD:main
