name: Restore verified Oracle Framboise

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-oracle-framboise.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Oracle Framboise originals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1y9zlMLB_HjC9YuEfj9V6d0lHtpIeMUZp&export=download&confirm=t' \
            -o /tmp/oracle-framboise-product.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1SXFRsHl_Ly5CUsOEW9bI3Y5yhKdwksSc&export=download&confirm=t' \
            -o /tmp/oracle-framboise-worn.png

      - name: Verify exact Oracle Framboise binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/oracle-framboise-product.png)" -eq 3137033
          test "$(wc -c < /tmp/oracle-framboise-worn.png)" -eq 2056957
          echo '64851416a1339f3fef5c05c4df0f777672da8a0581f907e2b434ece6a2c2c826  /tmp/oracle-framboise-product.png' | sha256sum -c -
          echo 'dccccf79d00c9047123480e8d39f02e5c2c3a030c008ec104a9abadb841ef611  /tmp/oracle-framboise-worn.png' | sha256sum -c -
          test "$(head -c 8 /tmp/oracle-framboise-product.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 8 /tmp/oracle-framboise-worn.png | xxd -p)" = '89504e470d0a1a0a'

      - name: Add only Oracle Framboise assets and selector entry
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/oracle-framboise-product.png public/couture/bandanas/oracle-framboise.png
          cp /tmp/oracle-framboise-worn.png public/couture/bandanas/oracle-framboise-perro.png
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/apps/CoutureStoreApp.tsx')
          text = path.read_text()
          if '/couture/bandanas/oracle-framboise.png' in text:
              raise SystemExit('Oracle Framboise already exists; refusing duplicate')
          anchor = '  { id: "foret", name: "Fôret", swatch: "#355c45", productImage: "/couture/bandanas/oracle-foret.png", wornImage: "/couture/bandanas/oracle-foret-perro.png" },\n'
          addition = '  { id: "framboise", name: "Framboise", swatch: "#bd496f", productImage: "/couture/bandanas/oracle-framboise.png", wornImage: "/couture/bandanas/oracle-framboise-perro.png" },\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected Oracle Foret anchor exactly once; refusing broad edit')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Commit only Oracle Framboise and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/couture/bandanas/oracle-framboise.png
          git add public/couture/bandanas/oracle-framboise-perro.png
          git add src/components/apps/CoutureStoreApp.tsx
          git rm .github/workflows/restore-oracle-framboise.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/restore-oracle-framboise.yml'
            'public/couture/bandanas/oracle-framboise-perro.png'
            'public/couture/bandanas/oracle-framboise.png'
            'src/components/apps/CoutureStoreApp.tsx'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'feat(couture): add verified Oracle Framboise color'
          git push origin HEAD:main
