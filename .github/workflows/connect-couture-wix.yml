name: Connect Couture checkout to Wix catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-couture-wix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Couture Wix binding
        run: python .github/scripts/connect-couture-wix.py

      - name: Verify build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check
          grep -q 'item.id.startsWith("couture:")' src/lib/wix-commerce-map.ts

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/wix-commerce-map.ts
          git rm .github/workflows/connect-couture-wix.yml .github/scripts/connect-couture-wix.py
          git diff --cached --check
          git commit -m 'feat(couture): connect bandanas to Wix checkout'
          git push origin main
