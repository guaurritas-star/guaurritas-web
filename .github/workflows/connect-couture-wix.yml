name: Connect Couture checkout to Wix catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-couture-wix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Couture Wix binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/wix-commerce-map.ts')
          s = p.read_text()
          marker = '\nexport function resolveCuisineWixBinding(\n'
          assert s.count(marker) == 1
          block = r'''

const coutureProducts: Record<string, { productId: string; colors: Record<string, string> }> = {
  amulette: {
    productId: "eb5fc006-e815-4c42-b230-01e8fc8458bb",
    colors: {
      crepuscule: "Crépuscule",
      foret: "Fôret",
      ciel: "Ciel",
      framboise: "Framboise",
      ivoire: "Ivoire",
      lilas: "Lilas",
      soleil: "Soleil",
      tangerine: "Tangerine",
      terracotta: "Terracotta",
    },
  },
  abeille: {
    productId: "e90af6ed-c19e-4ca3-8bc0-82f5d4276b55",
    colors: {
      ciel: "Ciel",
      foret: "Fôret",
      tangerine: "Tangerine",
      lilas: "Lilas",
      ivoire: "Ivoire",
      framboise: "Framboise",
      soleil: "Soleil",
      terracotta: "Terracotta",
    },
  },
  "coeur-sacre": {
    productId: "7a91483c-da75-4307-9658-4e6e03ab059a",
    colors: {
      ciel: "Ciel",
      foret: "Fôret",
      framboise: "Framboise",
      ivoire: "Ivoire",
      lilas: "Lilas",
      soleil: "Soleil",
      tangerine: "Tangerine",
      terracotta: "Terracotta",
    },
  },
  oracle: {
    productId: "0777abd6-6c8a-4014-ba38-f374744a165a",
    colors: {
      ciel: "Ciel",
      foret: "Fôret",
      framboise: "Framboise",
      ivoire: "Ivoire",
      lilas: "Lilas",
      soleil: "Soleil",
      tangerine: "Tangerine",
      terracotta: "Terracotta",
    },
  },
  confetti: {
    productId: "b38a1cac-693d-0866-78cb-e30a0840e47d",
    colors: {
      rose: "Rosé",
      macaron: "Macaron",
      framboise: "Framboise",
    },
  },
};

const coutureSizes: Record<string, string> = {
  mini: "Mini",
  chica: "Chica",
  mediana: "Mediana",
  grande: "Grande",
  xl: "XL",
};

function resolveCoutureWixBinding(item: CuisineCartIdentity): WixCartBinding {
  const parts = item.id.split(":");
  const collectionId = parts[1];
  const colorId = parts[2];
  const sizeId = parts[3];
  const collection = coutureProducts[collectionId];
  const color = collection?.colors[colorId];
  const size = coutureSizes[sizeId];

  if (!collection || !color || !size) {
    return {
      supported: false,
      reason: `No pudimos identificar la colección, color o talla de ${item.name}.`,
    };
  }

  return supported(collection.productId, item.unitPrice, {
    options: {
      Tamaño: size,
      Color: color,
    },
  });
}
'''
          s = s.replace(marker, block + marker)
          old = '''  if (!item.id.startsWith("cuisine:")) {
    return {
      supported: false,
      reason: "Este artículo todavía no pertenece al catálogo Cuisine conectado a Wix.",
    };
  }
'''
          new = '''  if (item.id.startsWith("couture:")) {
    return resolveCoutureWixBinding(item);
  }

  if (!item.id.startsWith("cuisine:")) {
    return {
      supported: false,
      reason: "Este artículo todavía no pertenece al catálogo conectado a Wix.",
    };
  }
'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Verify Couture Wix binding and build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'eb5fc006-e815-4c42-b230-01e8fc8458bb' src/lib/wix-commerce-map.ts
          grep -q 'b38a1cac-693d-0866-78cb-e30a0840e47d' src/lib/wix-commerce-map.ts
          grep -q 'item.id.startsWith("couture:")' src/lib/wix-commerce-map.ts
          npm ci
          npm run build
          git diff --check
          test "$(git diff --name-only | grep -v '^\.github/workflows/connect-couture-wix.yml$' | wc -l)" -eq 1
          git diff --name-only | grep -q '^src/lib/wix-commerce-map.ts$'

      - name: Commit mapping and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/wix-commerce-map.ts
          git rm .github/workflows/connect-couture-wix.yml
          git diff --cached --check
          git commit -m 'feat(couture): connect bandanas to Wix checkout'
          git push origin main
